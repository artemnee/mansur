# Releases are built on GitHub's servers straight from the source on a tag (git tag v0.1.0 && git push --tags).
# Every file gets a build provenance attestation, so anyone can verify
# that the binary was built from this repository and not swapped by hand.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # upload files to the release
  id-token: write      # sign the attestation
  attestations: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

      - name: Build
        run: |
          make dmg VERSION=$GITHUB_REF_NAME
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" -o dist/mansur .
            tar -C dist -czf dist/mansur-darwin-$arch.tar.gz mansur
            rm dist/mansur
          done
          cd dist && shasum -a 256 Mansur.dmg mansur-darwin-*.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/Mansur.dmg
            dist/mansur-darwin-*.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Mansur.dmg
            dist/mansur-darwin-*.tar.gz
            dist/SHA256SUMS
